    <path d="M190 306 L190 216" stroke="#4FCC60" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M190 234 C 169 228, 158 211, 160 192 C 179 194, 190 213, 190 234 Z"/>
    <path d="M190 234 C 211 228, 222 211, 220 192 C 201 194, 190 213, 190 234 Z"/>
    <path d="M190 270 C 171 265, 161 250, 163 233 C 180 235, 190 252, 190 270 Z"/>
    <path d="M190 270 C 209 265, 219 250, 217 233 C 200 235, 190 252, 190 270 Z"/>
    <path d="M171 324 C 175 311, 182 302, 190 296 C 186 307, 181 316, 179 324 Z"/>
    <path d="M209 324 C 205 311, 198 302, 190 296 C 194 307, 199 316, 201 324 Z"/>
    <path d="M190 324 L190 298 C 192 307, 193 316, 193 324 Z"/>
