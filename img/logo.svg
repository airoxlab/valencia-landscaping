    <ellipse cx="64"  cy="232" rx="23" ry="11" transform="rotate(-40 64 232)"/>
    <ellipse cx="60"  cy="270" rx="23" ry="11" transform="rotate(-20 60 270)"/>
    <ellipse cx="67"  cy="308" rx="22" ry="11" transform="rotate(-2 67 308)"/>
    <ellipse cx="86"  cy="340" rx="20" ry="10" transform="rotate(18 86 340)"/>

    <path d="M284 150 C 324 194, 330 262, 304 318 C 296 334, 284 348, 270 358 L 262 345 C 275 336, 286 323, 293 308 C 315 261, 309 203, 276 162 Z"/>
    <ellipse cx="302" cy="196" rx="23" ry="11" transform="rotate(58 302 196)"/>
    <ellipse cx="316" cy="232" rx="23" ry="11" transform="rotate(40 316 232)"/>
    <ellipse cx="320" cy="270" rx="23" ry="11" transform="rotate(20 320 270)"/>
