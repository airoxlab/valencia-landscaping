  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="33" fill="#FFFFFF" letter-spacing="2.5">
    <textPath href="#vl-bot" startOffset="50%" text-anchor="middle">LANDSCAPING</textPath>
