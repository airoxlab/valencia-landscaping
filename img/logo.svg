  <!-- wordmark -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#vl-top" startOffset="50%" text-anchor="middle">VALENCIA</textPath>
