      c 0 -34 19 -55 46 -55
      c 27 0 46 21 46 55
      c 0 34 -10 60 -23 82
      l 28 15
      c 14 -25 27 -57 27 -97
      c 0 -48 -32 -84 -78 -84 Z"/>
  <g fill="#8C2F4C">
    <circle cx="138" cy="214" r="4.8"/>
    <circle cx="138" cy="241" r="4.8"/>
    <circle cx="144" cy="268" r="4.8"/>
    <circle cx="242" cy="214" r="4.8"/>
    <circle cx="242" cy="241" r="4.8"/>
    <circle cx="236" cy="268" r="4.8"/>
  </g>

  <!-- sprout -->
